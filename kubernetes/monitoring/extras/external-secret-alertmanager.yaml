apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp-secret
  namespace: monitoring
spec:
  # How often to sync from AWS Secrets Manager
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # The Kubernetes Secret that ESO will create/maintain
  target:
    name: alertmanager-smtp-secret   # same name AlertManager expects
    creationPolicy: Owner            # ESO owns this secret — recreates if deleted

  # Map AWS secret fields to Kubernetes secret keys
  data:
    - secretKey: gmail-password              # key inside the Kubernetes secret
      remoteRef:
        key: cloudcommerce/alertmanager-smtp # AWS Secrets Manager secret name
        property: gmail-password             # field inside the JSON secret
