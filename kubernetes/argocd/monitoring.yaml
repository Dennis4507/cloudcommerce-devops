apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  sources:
    # Pull chart from Prometheus community Helm repo
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "65.8.0"
      helm:
        valueFiles:
          - $values/kubernetes/monitoring/kube-prometheus-stack-values.yaml

    # Pull values file from our Git repo
    - repoURL: https://github.com/Dennis4507/cloudcommerce-devops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
