apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  sources:
    # Pull chart from Grafana Helm repo
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: "2.10.2"
      helm:
        valueFiles:
          - $values/kubernetes/monitoring/loki-stack-values.yaml

    # Pull values file from our Git repo
    - repoURL: https://github.com/Dennis4507/cloudcommerce-devops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Prevent ArgoCD from reverting our isDefault:false patch on the
  # auto-generated loki-loki-stack datasource ConfigMap. The loki-stack chart
  # always sets isDefault:true which conflicts with Prometheus being default.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: loki-loki-stack
      namespace: monitoring
      jsonPointers:
        - /data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
