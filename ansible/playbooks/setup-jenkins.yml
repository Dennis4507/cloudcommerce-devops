---
- name: Install and configure Jenkins
  hosts: jenkins
  become: true

  tasks:

    - name: Remove stale Jenkins keyring files if present
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/keyrings/jenkins-keyring.gpg
        - /usr/share/keyrings/jenkins-keyring.asc
        - /etc/apt/sources.list.d/jenkins.list

    - name: Import Jenkins GPG key by exact key ID
      shell: |
        gpg --batch --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 7198F4B714ABFC68
        gpg --batch --export --armor 7198F4B714ABFC68 > /usr/share/keyrings/jenkins-keyring.asc
        chmod 644 /usr/share/keyrings/jenkins-keyring.asc

    - name: Add Jenkins apt repository
      shell: |
        echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" \
          > /etc/apt/sources.list.d/jenkins.list

    - name: Remove Java 17 if present
      apt:
        name: openjdk-17-jdk
        state: absent

    - name: Install Java 21 and dependencies
      apt:
        name:
          - openjdk-21-jdk
          - curl
          - gnupg
          - unzip
        state: present
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes

    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Install Trivy
      shell: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      args:
        creates: /usr/local/bin/trivy

    - name: Clean up any partial AWS CLI install
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws

    - name: Install AWS CLI
      shell: |
        set -e
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install
        rm -rf /tmp/awscliv2.zip /tmp/aws
      args:
        creates: /usr/local/bin/aws

    - name: Wait for Jenkins to start
      wait_for:
        port: 8080
        delay: 10
        timeout: 120

    - name: Get Jenkins initial admin password
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password
      changed_when: false
      failed_when: false

    - name: Print Jenkins initial admin password
      debug:
        msg: "Jenkins initial admin password: {{ jenkins_password.stdout | default('already configured - file no longer exists') }}"
