---
- name: Install and configure ArgoCD on k3s
  hosts: k3s
  become: true

  tasks:

    - name: Create argocd namespace
      shell: k3s kubectl create namespace argocd
      register: ns_result
      failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
      changed_when: "'already exists' not in ns_result.stderr"

    - name: Install ArgoCD
      shell: k3s kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      changed_when: false

    - name: Wait for ArgoCD pods to be ready
      shell: k3s kubectl wait --for=condition=Ready pods --all -n argocd --timeout=300s
      register: argocd_ready
      changed_when: false

    - name: Expose ArgoCD UI on NodePort 30080
      shell: >
        k3s kubectl patch svc argocd-server -n argocd
        -p '{"spec":{"type":"NodePort","ports":[{"name":"https","port":443,"targetPort":8080,"nodePort":30080,"protocol":"TCP"}]}}'
      changed_when: false

    - name: Get ArgoCD initial admin password
      shell: k3s kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      changed_when: false

    - name: Print ArgoCD initial admin password
      debug:
        msg: "ArgoCD UI: https://63.184.235.88:30080 | username: admin | password: {{ argocd_password.stdout }}"
